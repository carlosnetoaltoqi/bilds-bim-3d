# CI mínimo (I20 da auditoria, 2026-09-04). Dois jobs independentes:
#
#   biblioteca — pip install -e biblioteca, py_compile e `pytest tests/biblioteca tests/arquitetura` sem o marcador
#     `thumbs` (o Chromium exige libs de sistema). As fixtures reais são locais (tests/fixtures.local.json,
#     gitignored), então os testes que dependem delas PULAM aqui com motivo — o que roda são os sintéticos,
#     os contratos e as sete regras de fronteira (docs/arquitetura.md §3).
#   servicos — `pnpm install --frozen-lockfile` + `pnpm -r build` na raiz (pacotes para dist/ com project references,
#     depois os cinco serviços e o web) e `pytest tests/servicos` (harnesses Node sem Mongo). Não sobe Chromium.
#   Versões: Node em .nvmrc, pnpm em packageManager (package.json), Python em .python-version.
#
# Localmente a mesma coisa é: python3 -m pytest -m "not thumbs"  e  pnpm -r build
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biblioteca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Node só para os testes de paridade (tests/paridade/dump_ts.mjs roda .ts com
      # --experimental-strip-types e usa node:sqlite — precisa de Node >= 22.5; 24 é o da máquina de dev).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dependências Python (requirements-dev.txt + a biblioteca bim_pipeline)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install -e biblioteca

      - name: py_compile da biblioteca
        run: python -m py_compile biblioteca/bim_pipeline/*.py biblioteca/bim_pipeline/*/*.py biblioteca/bim_pipeline/*/*/*.py

      - name: pytest — biblioteca e arquitetura (sem Chromium; fixtures reais pulam com motivo)
        run: python -m pytest tests/biblioteca tests/arquitetura -m "not thumbs" -rs

  servicos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # a versão do pnpm vem do campo packageManager do package.json da raiz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pytest — serviços (harnesses Node com ts-node; sem Mongo nem Chromium)
        run: python -m pip install -r requirements-dev.txt && python -m pytest tests/servicos -m "not thumbs" -rs
