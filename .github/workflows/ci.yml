# CI mínimo (I20 da auditoria, 2026-09-04). Dois jobs independentes:
#
#   pipeline-estatico — py_compile de scripts/ e a suíte tests/ sem o marcador
#     `thumbs` (o Chromium do Playwright exige libs de sistema; fica para depois).
#     Os `.aq` de input/ são gitignored, então os testes que dependem deles PULAM
#     aqui com motivo — o que roda são os blobs OQ3D sintéticos, o contrato do
#     parser, o render dos templates e a paridade Python ↔ TypeScript em blobs
#     sintéticos (Node 24 roda os .ts de www/tools direto, sem transpilar).
#   www — `pnpm install --frozen-lockfile` + `pnpm -r build` (API com tsc, web com
#     next build). Não sobe Mongo nem roda a POC; só prova que compila.
#   Versões: Node em .nvmrc, pnpm em packageManager (package.json), Python em .python-version.
#
# Localmente a mesma coisa é: python3 -m pytest -m "not thumbs"  e  (cd www && pnpm -r build)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Node só para os testes de paridade (tests/paridade/dump_ts.mjs roda .ts com
      # --experimental-strip-types e usa node:sqlite — precisa de Node >= 22.5; 24 é o da máquina de dev).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dependências Python (requirements.txt + requirements-dev.txt)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: py_compile de scripts/ e eng-reversa/tools/
        run: python -m py_compile scripts/*.py eng-reversa/tools/*.py

      - name: pytest (sem Chromium; fixtures de input/ pulam com motivo)
        run: python -m pytest -m "not thumbs" -rs

  www:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4

      # a versão do pnpm vem do campo packageManager do www/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: www/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build
