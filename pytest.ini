[pytest]
# Suíte da biblioteca bim_pipeline e dos serviços. Roda com `python3 -m pytest` na raiz.
# www/ tem o .venv do worker com os testes do numpy dentro — nunca recursar lá.
testpaths = tests
norecursedirs = www node_modules .venv output docs input biblioteca
addopts = -ra
markers =
    thumbs: renderiza miniatura de verdade no Chromium (Node >= 20 + Playwright instalados)
    paridade: compara com o port TypeScript em www/tools (Node >= 22, roda .ts direto)
    aq: precisa de fixtures em input/ (gitignored; pula no CI)
